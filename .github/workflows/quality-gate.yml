name: quality-gate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block obvious secrets
        shell: bash
        run: |
          set -e
          if grep -RInE             --exclude-dir=.git             --exclude-dir=.github             --exclude-dir=docs             --exclude='*.md'             '(api[_-]?key|secret[_-]?key|access[_-]?token|private[_-]?key)[[:space:]]*=[[:space:]]*["'\''][^"$][^"'\'']{8,}["'\'']' .; then
            echo "Potential hardcoded secret found."
            exit 1
          fi

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || find . -maxdepth 3 -type f -name 'test_*.py' | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install pytest

      - name: Run Python tests
        if: steps.detect.outputs.python == 'true'
        run: pytest -q

      - name: Set up Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        if: steps.detect.outputs.node == 'true'
        run: npm ci

      - name: Run Node tests
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          npm test -- --runInBand || npm test
